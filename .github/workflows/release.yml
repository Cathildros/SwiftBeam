name: Build and Release SwiftBeam

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix (optional, defaults to Directory.Build.props)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver) -and "${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart('v', 'V')
          }
          if ([string]::IsNullOrWhiteSpace($ver)) {
            [xml]$props = Get-Content Directory.Build.props -Raw
            $ver = $props.Project.PropertyGroup.Version
          }
          $ver = $ver.Trim().TrimStart('v', 'V')
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved Windows build version: $ver"

      - name: Run Core Unit Tests
        run: dotnet test tests/SwiftBeam.Core.Tests/SwiftBeam.Core.Tests.csproj -c Release

      - name: Publish Windows binaries and SwiftBeam-Setup.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/publish.ps1 -Runtimes win-x64 -Version "$env:RELEASE_VERSION"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/win-x64/SwiftBeam-Setup.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [[ -z "$VER" && "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"
          fi
          if [[ -z "$VER" ]]; then
            VER="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -n1)"
          fi
          VER="${VER#v}"
          VER="${VER#V}"
          echo "RELEASE_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Resolved Linux build version: ${VER}"

      - name: Run Core Unit Tests
        run: dotnet test tests/SwiftBeam.Core.Tests/SwiftBeam.Core.Tests.csproj -c Release

      - name: Publish Linux standalone binary
        shell: bash
        run: |
          mkdir -p dist/linux-x64
          dotnet publish src/SwiftBeam.Desktop/SwiftBeam.Desktop.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:Version="$RELEASE_VERSION" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o dist/linux-x64

          cp dist/linux-x64/SwiftBeam dist/linux-x64/SwiftBeam-Linux-x64
          chmod +x dist/linux-x64/SwiftBeam-Linux-x64

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/linux-x64/SwiftBeam-Linux-x64
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses and ensure SDK 35
        shell: bash
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;36.0.0" >/dev/null
          fi

      - name: Run Android Unit Tests and Build Release APK
        env:
          SWIFTBEAM_KEYSTORE_B64: ${{ secrets.SWIFTBEAM_KEYSTORE_B64 }}
          SWIFTBEAM_KEYSTORE_PASSWORD: ${{ secrets.SWIFTBEAM_KEYSTORE_PASSWORD }}
          SWIFTBEAM_KEY_ALIAS: ${{ secrets.SWIFTBEAM_KEY_ALIAS }}
          SWIFTBEAM_KEY_PASSWORD: ${{ secrets.SWIFTBEAM_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$SWIFTBEAM_KEYSTORE_B64" ]; then
            echo "$SWIFTBEAM_KEYSTORE_B64" | base64 -d > /tmp/swiftbeam-release.jks
            export SWIFTBEAM_KEYSTORE_PATH=/tmp/swiftbeam-release.jks
          fi
          chmod +x android/gradlew
          cd android
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Stage SwiftBeam-Android.apk
        shell: bash
        run: |
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release.apk dist/android/SwiftBeam-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/android/SwiftBeam-Android.apk
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VER="${{ github.event.inputs.version }}"
          if [[ -z "$VER" && "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"
          fi
          if [[ -z "$VER" ]]; then
            VER="$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -n1)"
          fi
          VER="${VER#v}"
          VER="${VER#V}"
          TAG="v${VER}"

          cd release-assets
          sha256sum SwiftBeam-Setup.exe SwiftBeam-Linux-x64 SwiftBeam-Android.apk > sha256sums.txt
          cat sha256sums.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SwiftBeam-Setup.exe SwiftBeam-Linux-x64 SwiftBeam-Android.apk sha256sums.txt --clobber
          else
            gh release create "$TAG" SwiftBeam-Setup.exe SwiftBeam-Linux-x64 SwiftBeam-Android.apk sha256sums.txt --title "SwiftBeam ${TAG}" --generate-notes
          fi
